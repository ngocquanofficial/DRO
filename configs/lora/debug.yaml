# pytorch_lightning==2.0.2
trainer:
  accelerator: gpu
  devices: 1
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: output
      name: cifar100-flat
  max_epochs: 400
  # max_steps: 10000
  val_check_interval: 100
  num_sanity_val_steps: 0
model:
  model_name: vit-b16-224-dino
  training_mode: lora
  optimizer: svgd
  lr: 0.5
  momentum: 0.9
  weight_decay: 0.0
  scheduler: cosine
  warmup_steps: 500
  lora_r: 8
  lora_alpha: 8
  num_particles: 1
  use_sam: True
data:
  dataset: cifar100
  root: ../flat_bnn_dro/vtab-1k/cifar100
  size: 224
  batch_size: 24
  workers: 4

model_checkpoint:
  dirpath: saved_checkpoints_new
  filename: latest_cifar_DRO
  save_last: true   
  monitor: val_acc  
  mode: max         
  save_top_k: 1     

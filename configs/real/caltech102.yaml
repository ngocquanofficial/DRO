# pytorch_lightning==2.0.2
trainer:
  accelerator: gpu
  devices: 1
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: output
      name: caltech-real
  max_epochs: 200
  # max_steps: 10000
  val_check_interval: 100
  num_sanity_val_steps: 0
model:
  model_name: vit-b16-224-dino
  training_mode: lora
  optimizer: svgd
  rho: 0.05
  lr: 0.15
  momentum: 0.9
  weight_decay: 1e-4
  scheduler: cosine
  warmup_steps: 500
  lora_r: 8
  lora_alpha: 8
  num_particles: 4
  use_sam: True
data:
  dataset: caltech101
  root: ../vtab-1k/caltech101
  size: 224
  batch_size: 32
  workers: 4
  train_aug: False

model_checkpoint:
  dirpath: saved_checkpoints_new
  filename: dtd-step-{step}-{val_acc:.4f}
  monitor: val_acc
  mode: max
  save_last: true